<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe9a0"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6a12"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo negro -->
  <rect width="1000" height="1000" fill="#050505"/>

  <!-- Círculo dorado -->
  <circle cx="500" cy="500" r="460" fill="none" stroke="url(#gold)" stroke-width="14"/>
  <circle cx="500" cy="500" r="440" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.5"/>

  <!-- PURGATORIO -->
  <text x="500" y="460" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="92" font-weight="bold"
        fill="url(#gold)"
        letter-spacing="6"
        filter="url(#glow)">
    PURGATORIO
  </text>

  <!-- Línea decorativa -->
  <line x1="220" y1="510" x2="780" y2="510" stroke="#d4af37" stroke-width="2.5"/>
  <circle cx="500" cy="510" r="5" fill="#d4af37"/>

  <!-- SCAN -->
  <text x="500" y="600" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="72" font-weight="bold"
        fill="#e8c547"
        letter-spacing="18">
    SCAN
  </text>
</svg>
